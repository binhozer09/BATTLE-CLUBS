name: Solicitar arquivo de ativação da Unity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    name: Gerar arquivo de ativação para a compilação Android
    runs-on: ubuntu-latest
    steps:
      - name: Solicitar arquivo de ativação
        id: activation
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.62f1

      - name: Disponibilizar arquivo de ativação
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-2022.3.62f1
          path: ${{ steps.activation.outputs.filePath }}
